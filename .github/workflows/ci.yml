name: CI

# Every layer of the test pyramid this project has, run in order of increasing
# cost: lint/typecheck first (seconds), then the pure unit suite (milliseconds
# of actual test time), then the emulator-backed rules and integration suites
# (these are what prove tenant isolation and concurrent-writer safety against a
# real Realtime Database and Firestore, not a mock), then the full end-to-end
# suite against a real browser driving the real production build. A failure at
# any stage stops the ones after it — there is no point spending five minutes
# on Playwright if `tsc` already found a type error.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-visual-baseline:
        description: 'Regenerate the Linux visual-regression baseline and upload it as an artifact instead of comparing against the committed one'
        type: boolean
        default: false

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the same suite as `test:unit` with coverage instrumentation on —
      # no need to run it twice.
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The isolation proof: tenant A cannot read or write tenant B's board, in
  # Firestore or the Realtime Database, run against the real emulators rather
  # than asserted in a design document. See tests/rules/*.test.ts.
  rules-and-integration:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm run test:rules
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Visual regression is non-blocking until a Linux baseline exists to compare
  # against — Playwright names snapshots per-OS (scoreboard-visual-win32.png
  # etc.), and the committed baseline was captured on a Windows dev machine, so
  # a straight comparison here would fail on every run for a reason that has
  # nothing to do with the code. To turn this into a real gate: run this
  # workflow once via workflow_dispatch with "update-visual-baseline" checked,
  # download the "visual-baseline-linux" artifact it produces, commit the
  # `*-linux.png` files under tests/e2e/visual.spec.ts-snapshots/, then remove
  # `continue-on-error` below.
  visual:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Run visual regression
        if: ${{ !inputs.update-visual-baseline }}
        run: npm run test:visual
      - name: Regenerate baseline
        if: ${{ inputs.update-visual-baseline }}
        run: npm run baseline
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update-visual-baseline }}
        with:
          name: visual-baseline-linux
          path: tests/e2e/visual.spec.ts-snapshots/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && !inputs.update-visual-baseline
        with:
          name: visual-diff
          path: test-results/
          retention-days: 14
